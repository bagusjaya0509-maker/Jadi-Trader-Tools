    <!-- ── SEO ──────────────────────────────────────────────────────────
         Sampai sekarang halaman ini cuma punya <title>. Akibatnya di hasil

         yang kebetulan ia temukan — dan pada aplikasi yang isinya digambar

         `description` itulah yang dibaca orang sebelum memutuskan mengklik.
         Ditulis seperti kalimat yang menjelaskan, bukan tumpukan kata kunci:
         Google sudah lama mengabaikan meta keywords, dan cuplikan yang
         terbaca seperti daftar kata justru menurunkan orang yang mengklik.

         og: dan twitter: dipakai saat tautannya dibagikan di WhatsApp,
         Instagram, Discord, atau X. Tanpa itu yang muncul cuma URL polos —
         dan untuk situs yang penyebarannya lewat pesan pribadi, kartu
         pratinjau jauh lebih menentukan daripada peringkat pencarian. -->
