    <!-- ── Tautan lama /#/apa-pun → /apa-pun ────────────────────────────
         Sampai 17 Agu 2026 aplikasi ini memakai HashRouter, jadi seluruh
         alamat yang pernah dibagikan berbentuk jaditrader.co.id/#/journal.
         Sesudah pindah ke BrowserRouter, alamat begitu memuat halaman depan
         dan tanda pagarnya diabaikan — tautannya tidak menghasilkan galat,
         ia cuma diam-diam mendarat di tempat yang salah. Itu jenis kerusakan
         yang paling lama tidak ketahuan.

         Yang paling menentukan bukan bookmark orang, melainkan LYNK: alamat
         tujuan sesudah pembayaran tersimpan di setelan Lynk, di luar
         jangkauan kode ini. Kalau /#/aktivasi berhenti bekerja, yang melihat
         akibatnya adalah orang yang baru saja mengirim uang.

         Dijalankan di <head> dan bukan di dalam React: ia harus selesai
         SEBELUM router membaca alamatnya, kalau tidak halaman depan sempat
         tergambar dulu lalu melompat. Tanpa `defer`, tanpa `type=module` —
         keduanya menunda eksekusi sampai sesudah dokumen terurai. -->
    <script>
      (function () {
        var h = window.location.hash;
        if (h.slice(0, 2) !== '#/') return;
        var tujuan = h.slice(1);          /* "/chart?simbol=BTCUSDT" */
        var luar = window.location.search; /* "?r=..." mode preview */
        if (luar.length > 1) {
          tujuan += (tujuan.indexOf('?') === -1 ? '?' : '&') + luar.slice(1);
        }
        window.history.replaceState(null, '', tujuan);
      })();
    </script>

    <!-- ── TEMA DIPASANG SEBELUM GAMBAR PERTAMA ──────────────────────────
         Dilaporkan pemilik: dengan tema terang, refresh paksa (Ctrl+Shift+R)
         menampilkan layar HITAM selama memuat, lalu melompat jadi putih
         begitu selesai.

         Bukan hal wajar, dan sebabnya di baris kedua berkas ini:
         <html class="dark">. Dokumen ini gelap sejak byte pertama, dan
         `data-tema` baru dipasang oleh React — sesudah modulnya diunduh,
         diurai, dan dipasang. Di muatan bercache jeda itu beberapa
         milidetik dan tidak tertangkap mata; di refresh paksa ia jadi
         lamanya seluruh unduhan.

         Skrip ini SENGAJA tanpa defer dan tanpa type=module — sama seperti
         penyelamat alamat di atasnya, dan dengan alasan yang sama persis:
         keduanya menunda eksekusi sampai dokumen selesai diurai, yang
         berarti sesudah gambar pertama. Yang diperbaiki justru gambar
         pertama itu.

         Kuncinya 'jt.tema', sama dengan yang dipakai TombolTema. Dibaca
         di dalam try: peramban mode privat melempar saat localStorage
         disentuh, dan tema yang gagal dibaca bukan alasan menggagalkan
         seluruh halaman.

         Latar juga ditulis langsung ke elemennya, bukan cuma diserahkan ke
         atribut. Lembar gaya masih boleh belum tiba pada saat ini; atribut
         tanpa gaya tidak mewarnai apa pun, sedangkan satu baris ini
         mewarnai. -->
    <script>
      (function () {
        var terang = false;
        try { terang = localStorage.getItem('jt.tema') === 'terang'; } catch (e) { /* privat */ }
        if (terang) document.documentElement.setAttribute('data-tema', 'terang');
        document.documentElement.style.backgroundColor = terang ? '#ffffff' : '#09090b';
      })();
    </script>

      /* Hanya di situs tayang. localhost dan pratinjau tidak boleh masuk

    <!-- ── KEDIPAN ISI CADANGAN, DIJADIKAN LAYAR MUAT ────────────────────
         Dilaporkan pemilik: mengetik jaditrader.co.id lalu Enter

         Itu isi cadangan #root di bawah. Ia memang harus ada — perayap dan

         Jendelanya bukan milidetik. Sebelum React bisa menimpanya,

         ditata supaya yang berkedip terlihat memang bagian dari situsnya.
